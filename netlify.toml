[build]
  publish = "."
  # Kein Build auf Netlify: app.js und styles.css werden lokal mit `npm run
  # build` erzeugt und mitverwaltet. Netlify liefert also weiterhin nur
  # statische Dateien aus. Wer src/app.jsx oder Klassennamen ändert, muss den
  # Build laufen lassen — sonst zeigt die Seite den alten Stand.
  command = "# Kein Build noetig: app.js und styles.css liegen fertig im Repo"

# Die vendorierten Bibliotheken sind versionsfest: eine andere React-Fassung
# käme unter einem anderen Dateinamen. Entsprechend hart zwischenspeichern.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  directory = "netlify/functions"

# The scan and scan-status functions each declare their own `config.path`
# (/api/scan and /api/scan-status), so Netlify serves them directly at those
# paths. /api/scan runs synchronously and returns the finished report in one
# request; /api/scan-status returns the last cached report. A manual `/api/*`
# rewrite is unnecessary (and would 404, since functions with `config.path` are
# not exposed under /.netlify/functions/<name>). The only redirect we need is
# the SPA fallback below, which Netlify evaluates *after* function routes, so it
# never shadows /api/scan or /api/scan-status.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
